[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secep-ingestion"
version = "0.1.0"
description = "SECEP Email Ingestion Service (M2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "cryptography>=43.0.3",
    "httpx>=0.27.2",
    "lxml>=5.3.0",
    "orjson>=3.10.11",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
